spring:
  sql:
    init:
      # ⚠️ never로 두면 shedlock 테이블이 안 생겨 @SchedulerLock이 매 주기 예외를 던지고
      #    스케줄러가 한 번도 실행되지 않는다. 회수 경로가 통째로 미검증 상태가 된다.
      mode: always
  jpa:
    # create-drop으로 엔티티 테이블을 먼저 만든 뒤 schema.sql(shedlock·FK)을 실행한다
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

notification:
  scheduler:
    retry:
      fixed-delay-ms: 60000
      batch-size: 100
    stuck:
      fixed-delay-ms: 300000
      threshold-minutes: 10

logging:
  level:
    com.notification: INFO
    org.hibernate.SQL: WARN
